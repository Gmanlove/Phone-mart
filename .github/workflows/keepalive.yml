name: Keepalive Pinger

on:
  schedule:
    # every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping configured URLs
        run: |
          set -euo pipefail

          urls=(
            "https://smartcoms.onrender.com"
            "https://phone-mart-frontend.vercel.app"
            "https://phone-mart-1.onrender.com"
            "https://www.smartcommunicationsltd.ng"
            "https://smartcommunicationsltd.ng"
            "https://maps.app.goo.gl/R9auquxBFEorUpVu7"
          )

          for u in "${urls[@]}"; do
            echo "[keepalive] pinging: $u"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$u" || echo "000")
            echo "[keepalive] result: $u -> $status"
          done
